apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctfd-mock
  namespace: reclaim-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctfd-mock
  template:
    metadata:
      labels:
        app: ctfd-mock
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ctfd
          image: reclaim-k8s-e2e-mock:local
          imagePullPolicy: Never
          env:
            - name: MOCK_MODE
              value: ctfd
          ports:
            - name: http
              containerPort: 8081
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
---
apiVersion: v1
kind: Service
metadata:
  name: ctfd-mock
  namespace: reclaim-gateway
spec:
  selector:
    app: ctfd-mock
  ports:
    - name: http
      port: 8081
      targetPort: http
