<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MEOWPASS Console{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="{{ url_for('index') }}" aria-label="MEOWPASS home">
        <span class="brand-icon">M</span>
        <span>
          <strong>MEOWPASS</strong>
          <small>FEEDER CONTROL</small>
        </span>
      </a>

      {% if session.get('account_id') %}
        <div class="account-bar">
          <span class="account-copy">
            <strong>{{ username }}</strong>
            <small>{{ role_label }}</small>
          </span>
          <form action="{{ url_for('logout') }}" method="post">
            <button class="text-button" type="submit">로그아웃</button>
          </form>
        </div>
      {% endif %}
    </header>

    <main class="page">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="alert {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
